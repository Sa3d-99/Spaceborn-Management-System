services:
  - type: web
    name: spaceborn-cms
    runtime: node
    plan: free
    region: oregon
    # The frontend is hosted on Vercel; this Render service only runs the API.
    buildCommand: npm ci --prefix backend --omit=dev
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://spaceborn-management-system.vercel.app
      # Leave headroom for native modules, PostgreSQL client buffers, and the OS.
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      - key: DATABASE_URL
        fromDatabase:
          name: spaceborn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 24h
      - key: TRUST_PROXY_HOPS
        value: "1"

databases:
  - name: spaceborn-db
    databaseName: spaceborn
    user: spaceborn_user
    plan: free
    region: oregon
